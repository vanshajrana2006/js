
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert, Prompt and Confirm</title>
</head>
<body>

    <h1>JavaScript Popup Demo</h1>

    <script>
        // 1. Display a welcome message
        alert("Welcome!");

        // 2. Ask the user for their name
        let name = prompt("What is your name?");

        // Check whether the user clicked Cancel
        if (name !== null) {

            // 3. Ask for confirmation
            let answer = confirm(
                "Hello " + name + "! Do you want to continue?"
            );

            // 4. Respond according to the user's choice
            if (answer) {
                alert("Let's get started, " + name + "!");
            } else {
                alert("You chose to cancel.");
            }

        } else {
            alert("You did not enter your name.");
        }
        document.write("hello" +" " +name)
    </script>

</body>
</html>
